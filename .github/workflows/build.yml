# OrigCore CI
#
# 只建置 Minecraft 1.21.11，刻意不建立多版本矩陣。
#
# 流程：
#   1. applyPatches          - 從 patch 堆疊還原 Minecraft 原始碼
#   2. compileJava           - 編譯
#   3. origcoreTest          - OrigCore 專屬單元測試（不需要啟動伺服器）
#   4. rebuildPatches + diff - 確認 patch 堆疊是可重現的
#   5. createMojmap*Jar      - 產出可用的伺服器 JAR
#
# 注意：一定要用 mojmap 變體；上游已刻意停用 reobf 變體的產生。

name: Build OrigCore

on:
  push:
    branches:
      - main
      - 'exp/**'
      - 'release/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Minecraft 1.21.11)
    runs-on: ubuntu-latest

    env:
      # 反編譯與編譯整份 Minecraft 相當吃記憶體。
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config --global user.email "ci@origcore.invalid"
          git config --global user.name "OrigCore CI"
          git config --global core.longpaths true

      - name: Apply upstream patch stack
        run: ./gradlew applyPatches --stacktrace

      - name: Compile
        run: ./gradlew :paper-server:compileJava --stacktrace

      - name: OrigCore unit tests
        run: ./gradlew :paper-server:origcoreTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origcore-test-results
          path: paper-server/build/test-results/origcoreTest/*.xml
          if-no-files-found: warn

      - name: Verify the patch stack is reproducible
        run: |
          ./gradlew rebuildPatches --stacktrace
          if ! git diff --exit-code -- paper-server/patches; then
            echo "::error::rebuildPatches changed paper-server/patches; the patch stack is not reproducible."
            exit 1
          fi

      - name: Build server jars
        run: ./gradlew createMojmapBundlerJar createMojmapPaperclipJar --stacktrace

      - name: Upload server jars
        uses: actions/upload-artifact@v4
        with:
          name: origcore-jars
          path: |
            paper-server/build/libs/origcore-bundler-*-mojmap.jar
            paper-server/build/libs/origcore-paperclip-*-mojmap.jar
          if-no-files-found: error
