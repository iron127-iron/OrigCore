group=io.papermc.paper

# OrigCore - OrigCore 核心自身的版本號。
# 這個值只代表 OrigCore，與 Minecraft／Bukkit API 版本無關。
# 它會被寫入 JAR manifest 的 OrigCore-Version 屬性，並顯示在啟動橫幅中。
origCoreVersion=0.1.0

# 注意：這裡是 Minecraft／Bukkit API 版本，不可以改成 OrigCore 的版本號。
# 它會經由 paper-api 的 apiVersioning.json 變成 Bukkit#getBukkitVersion() 的回傳值；
# 若被改掉，插件會判斷錯版本或拒絕載入。
version=1.21.11-R0.1-SNAPSHOT
mcVersion=1.21.11
# This is the current API version for use in (paper-)plugin.yml files
# During snapshot cycles this should be the anticipated version of the release target
apiVersion=1.21.11

# Set to true while updating Minecraft version
updatingMinecraft=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
